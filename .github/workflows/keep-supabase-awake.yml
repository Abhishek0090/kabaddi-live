# Free Supabase projects pause after 7 days without activity.
# This reads one row from `matches` every day so the project stays awake.
# Repo secrets needed: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY.
# Note: GitHub disables scheduled workflows in public repos after 60 days with
# no commits. Re-enable it under Actions if that happens.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the matches table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repo secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/matches?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY"
